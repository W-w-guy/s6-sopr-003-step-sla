# Alembic config.
# NOTE: keep this file pure ASCII. Alembic reads alembic.ini with the system
# locale encoding (GBK on zh-CN Windows), so non-ASCII comments here make
# `alembic upgrade` crash with UnicodeDecodeError before any migration runs.
#
# The DSN is NOT hardcoded here: alembic/env.py resolves it from
# SLA3057_DSN -> DATABASE_URL -> embedded pgserver (see pkg/db.py),
# so the same migration runs unchanged on Windows and Ubuntu.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
